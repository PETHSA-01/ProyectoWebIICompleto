# Configuracion de PostgREST para NexoPlay (Proyecto Final).
#
# PostgREST NO tiene su propio sistema de permisos: usa los roles y GRANTs
# nativos de Postgres (creados en db/init.sql: authenticator, web_anon,
# web_user, web_admin) y las políticas de Row Level Security de esas mismas
# tablas para decidir que puede ver/hacer cada peticion.
#
# Se conecta a la base SIEMPRE como "authenticator" (rol sin privilegios
# propios, solo LOGIN); por cada request, si trae un JWT valido, hace
# "SET ROLE <claim role>" para cambiarse al rol real (web_anon/web_user/web_admin)
# antes de correr la consulta.

# Cadena de conexion usando el rol "authenticator" (ver GRANT ... TO authenticator
# en db/init.sql). Cambiar el password en produccion.
db-uri = "postgres://authenticator:authenticator_pw_dev@db:5432/nexoplay"

# Esquema que PostgREST expone como API REST.
db-schema = "public"

# Rol que se usa cuando NO viene un JWT (peticiones anonimas).
db-anon-role = "web_anon"

# Debe ser EXACTAMENTE el mismo secreto que JWT_SECRET en el backend de
# GraphQL (.env): el mismo token que emite ese backend es el que aqui se
# verifica para decidir a que rol hacer SET ROLE.
jwt-secret = "cambia-esto-por-un-secreto-largo-y-aleatorio"

# El JWT que firma el backend trae el rol de Postgres en el claim "role"
# (ver src/auth/jwt.js). Este es el valor por defecto de PostgREST, se deja
# explicito para que quede documentado.
jwt-role-claim-key = ".role"

# Puerto donde PostgREST escucha dentro del contenedor.
server-port = 3000

# Evita que un cliente pida columnas/tablas de mas via "?select=" para las
# que no tiene permiso, sin necesidad de exponer eso como error confuso.
db-extra-search-path = "public"
