
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexoplay
      POSTGRES_USER: nexoplay_app
      POSTGRES_PASSWORD: nexoplay_dev
    ports:
      - "5432:5432"
    volumes:
      - nexoplay_pgdata:/var/lib/postgresql/data
      # Se ejecuta automaticamente la primera vez que se crea el volumen.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoplay_app -d nexoplay"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./postgrest.conf:/etc/postgrest.conf:ro
    command: ["postgrest", "/etc/postgrest.conf"]

volumes:
  nexoplay_pgdata:
